# Controlli su ogni branch (il risultato si vede nella PR): genera i PDF di
# prova ed esegue tutti i tests/check_*.py su Windows, la piattaforma vera di
# PieDF. Il job "controlli" è un controllo obbligatorio della protezione di main:
# una PR rossa non si può unire (non rinominare il job senza aggiornare la protezione).
#
# Parte a ogni push su un branch che non è main. I push dell'esecutore
# (GITHUB_TOKEN) non fanno partire workflow: per quelli il build lo avvia
# l'esecutore stesso con workflow_dispatch.
#
# Dopo i controlli costruisce l'exe (PyInstaller), lo prova con check_exe.py
# e allega lo zip alla run: si scarica dalla pagina della run per provarlo.
name: "Build"

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controlli:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dipendenze
        run: pip install -r requirements.txt

      - name: Compila
        run: python -m compileall -q piedf tests

      - name: PDF di prova
        run: python tests/make_test_pdfs.py

      - name: Controlli end-to-end
        run: |
          set -o pipefail
          esito=0
          for f in tests/check_*.py; do
            # check_exe ha bisogno di finestre vere: gira nel suo passo, dopo la build.
            [ "$f" = tests/check_exe.py ] && continue
            echo "::group::$f"
            if ! timeout 600 python -u "$f" 2>&1 | tee esito.txt; then
              echo "::error file=$f::$f non superato"
              { echo "**$f**"; echo '```'; grep -E "^FAIL|Traceback|Error" esito.txt | head -20; echo '```'; } >> fallimenti.md
              esito=1
            fi
            echo "::endgroup::"
          done
          exit $esito

      - name: Costruisci l'exe
        run: |
          pip install -r requirements-build.txt
          python tools/build_exe.py

      - name: Controlla l'exe
        # Senza offscreen: l'exe deve aprire una finestra vera.
        run: |
          set -o pipefail
          if ! env -u QT_QPA_PLATFORM timeout 300 python -u tests/check_exe.py 2>&1 | tee esito.txt; then
            { echo "**tests/check_exe.py**"; echo '```'; grep -E "^FAIL|Traceback|Error" esito.txt | head -20; echo '```'; } >> fallimenti.md
            exit 1
          fi

      - name: Allega lo zip
        uses: actions/upload-artifact@v4
        with:
          name: PieDF-win64
          path: dist/PieDF-*-win64.zip
          retention-days: 14

      # Per il job "ritenta": l'elenco dei controlli falliti.
      - name: Salva i fallimenti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fallimenti
          path: fallimenti.md
          if-no-files-found: ignore
          retention-days: 3

  # Se il Build fallisce sul branch di una PR dei worker, rimanda la PR all'esecutore
  # con le righe FAIL, al massimo 2 volte per PR: si sistema da sola senza aspettare
  # un "@claude" a mano. Un commento del GITHUB_TOKEN non avvia workflow, quindi
  # l'esecutore si lancia direttamente con workflow_dispatch.
  ritenta:
    needs: controlli
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fallimenti
        continue-on-error: true

      - name: Rimanda la PR all'esecutore
        run: |
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then echo "Nessuna PR aperta su $BRANCH"; exit 0; fi
          etichette=$(gh pr view "$pr" --json labels --jq '[.labels[].name] | join(",")')
          # Solo le PR dei worker (hanno un'etichetta claude:<modello>).
          case "$etichette" in *claude:haiku*|*claude:sonnet*|*claude:opus*) ;; *) echo "PR #$pr non è dei worker"; exit 0 ;; esac
          tentativi=$(gh pr view "$pr" --json comments --jq '[.comments[].body | select(contains("<!-- ritenta-build -->"))] | length')
          if [ "$tentativi" -ge 2 ]; then
            echo "Già 2 tentativi automatici su PR #$pr: serve un'occhiata a mano"
            exit 0
          fi
          modello=sonnet
          case "$etichette" in *claude:opus*) modello=opus ;; esac
          {
            echo "<!-- ritenta-build -->"
            echo "Il **Build su Windows** è fallito (tentativo automatico $((tentativi + 1)) di 2): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            cat fallimenti.md 2>/dev/null || echo "Nessun dettaglio salvato: guarda il log della run."
            echo
            echo "Correggi questi fallimenti sul branch della PR, senza indebolire i controlli."
          } > commento.md
          gh pr comment "$pr" --body-file commento.md
          gh workflow run claude-esecutore.yml -f numero="$pr" -f modello="$modello"
