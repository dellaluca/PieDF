# Release: a ogni tag v* (es. v0.1.0) costruisce l'exe su Windows, lo prova
# e pubblica una GitHub Release con le note e il codice sorgente. Lo zip compilato
# NON è pubblico (si vende a parte): finisce in una release in bozza "<tag>-zip",
# visibile solo ai collaboratori.
#
# Il tag deve corrispondere a __version__ in piedf/__init__.py:
#   1. aggiorna __version__ con una PR e uniscila;
#   2. git tag v0.1.0 && git push origin v0.1.0
name: "Release"

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Il tag corrisponde alla versione
        run: |
          versione=$(python -c "import piedf; print(piedf.__version__)")
          if [ "$TAG" != "v$versione" ]; then
            echo "::error::Il tag $TAG non corrisponde a __version__ = $versione in piedf/__init__.py"
            exit 1
          fi

      - name: Dipendenze
        run: pip install -r requirements.txt -r requirements-build.txt

      - name: Costruisci l'exe
        run: python tools/build_exe.py

      - name: Controlla l'exe
        run: |
          python tests/make_test_pdfs.py
          timeout 300 python -u tests/check_exe.py

      - name: Pubblica la release
        run: |
          note="PieDF $TAG: codice sorgente di questa versione (Source code, qui sotto). Per compilarlo da te: [docs/sviluppo.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/sviluppo.md). Funzioni e istruzioni: [README](https://github.com/$GITHUB_REPOSITORY#readme)."
          gh release create "$TAG" --title "PieDF $TAG" --notes "$note" --generate-notes
          # Lo zip compilato va in una release in BOZZA, che vedono solo i collaboratori del repo
          # (gli artifact delle run di un repo pubblico li scarica chiunque): si prende da lì per
          # la vendita. Una bozza non crea il tag "<tag>-zip" finché non viene pubblicata: non pubblicarla.
          zip=$(ls dist/PieDF-*-win64.zip)
          gh release create "$TAG-zip" "$zip" --draft --target "$GITHUB_SHA"             --title "PieDF $TAG — zip per la vendita (bozza privata, non pubblicare)"             --notes "Zip compilato e provato dal workflow Release per $TAG. Solo per i collaboratori: non pubblicare questa bozza."
