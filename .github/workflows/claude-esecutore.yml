# Esecutore: lavora su un ticket già valutato dall'orchestratore, con il
# modello che l'orchestratore ha scelto. Apre sempre una PR, mai push su main.
# Le istruzioni sono in .github/claude/esecutore.md.
#
# Gira su Linux: Qt in modalità offscreen basta per i controlli in tests/.
# Il controllo vero su Windows lo fa build.yml sulla PR.
name: "Claude · esecutore"

on:
  workflow_dispatch:
    inputs:
      numero:
        description: "Numero della issue o della PR"
        required: true
      modello:
        description: "Modello da usare"
        type: choice
        options: [haiku, sonnet, opus]
        default: sonnet

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: claude-esecutore-${{ inputs.numero }}
  cancel-in-progress: false

jobs:
  esegui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NUMERO: ${{ inputs.numero }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      QT_QPA_PLATFORM: offscreen
      # I controlli durano minuti: con il limite predefinito di 2 minuti Claude Code
      # sposta il comando in background e la sessione finisce mentre "aspetta".
      BASH_DEFAULT_TIMEOUT_MS: "900000"
      BASH_MAX_TIMEOUT_MS: "1200000"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Librerie di sistema per Qt offscreen
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Dipendenze Python
        run: pip install -r requirements.txt

      - name: Scegli il modello
        id: modello
        run: |
          # Il limite di turni cresce con il modello: Opus riceve i lavori più grandi.
          case "${{ inputs.modello }}" in
            haiku) echo "id=claude-haiku-5-5"  >> "$GITHUB_OUTPUT"; echo "turni=60"  >> "$GITHUB_OUTPUT" ;;
            opus)  echo "id=claude-opus-5-5"   >> "$GITHUB_OUTPUT"; echo "turni=200" >> "$GITHUB_OUTPUT" ;;
            *)     echo "id=claude-sonnet-5-5" >> "$GITHUB_OUTPUT"; echo "turni=140" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Esegui il ticket
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # I workflow si avviano tra loro come bot github-actions.
          allowed_bots: github-actions,github-actions[bot]
          prompt: |
            Segui le istruzioni in .github/claude/esecutore.md.
            Ticket da eseguire: #${{ env.NUMERO }} nel repo ${{ github.repository }}.
          claude_args: >-
            --model ${{ steps.modello.outputs.id }}
            --max-turns ${{ steps.modello.outputs.turni }}
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr:*),Bash(python:*),Bash(python3:*),Bash(pip:*),Bash(timeout:*),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*)"
            --disallowedTools "Monitor,Bash(gh pr merge:*),Bash(git push origin main*),Bash(git push origin HEAD:main*),Bash(git push --force*),Bash(git push -f*)"

      # La trascrizione completa della sessione (l'output nel log è nascosto):
      # serve a capire perché un'esecuzione non ha prodotto la PR.
      - name: Salva la trascrizione
        if: always() && steps.claude.outputs.execution_file != ''
        uses: actions/upload-artifact@v4
        with:
          name: trascrizione-${{ env.NUMERO }}-${{ github.run_id }}
          path: ${{ steps.claude.outputs.execution_file }}
          retention-days: 14

      # Rete di sicurezza: il runner si butta via a fine job. Se la sessione ha
      # lasciato commit o modifiche su un branch senza pubblicarlo (#21 ha perso
      # così 37 minuti di lavoro), li pubblichiamo e apriamo una PR in bozza.
      - name: Pubblica il lavoro rimasto in locale
        if: always()
        run: |
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ] || [ "$branch" = "HEAD" ]; then
            if [ -z "$(git status --porcelain)" ]; then echo "Niente da salvare"; exit 0; fi
            branch="claude/salvataggio-$NUMERO-${{ github.run_id }}"
            git switch -c "$branch"
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain -- . ':!.github/workflows')" ]; then
            git add -A -- . ':!.github/workflows'
            git commit -q -m "Lavoro non salvato dalla sessione (salvataggio automatico)"
          fi
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then echo "Nessun commit nuovo"; exit 0; fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse "origin/$branch" 2>/dev/null)" ]; then
            echo "$branch è già pubblicato"
          else
            git push -u origin "$branch"
          fi
          if gh pr view "$NUMERO" --json number >/dev/null 2>&1; then
            # Il numero è una PR: il lavoro è sul suo branch, basta dirlo lì.
            gh pr comment "$NUMERO" --body "La sessione è finita senza pubblicare: il lavoro rimasto sul runner è stato committato e pubblicato qui («salvataggio automatico»), da controllare. Esecuzione: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          elif [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --draft --base main --head "$branch" \
              --title "Bozza da salvataggio automatico per #$NUMERO" \
              --body "La sessione dell'esecutore è finita senza aprire la PR: qui c'è il lavoro rimasto sul runner, da controllare. Esecuzione: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Closes #$NUMERO"
          fi

      # Le PR aperte con il GITHUB_TOKEN non fanno partire il workflow di build:
      # lo avviamo qui sul branch della PR, così il controllo compare nella PR.
      - name: Avvia il build della PR
        if: always()
        run: |
          if gh pr view "$NUMERO" --json headRefName >/dev/null 2>&1; then
            branch=$(gh pr view "$NUMERO" --json headRefName --jq .headRefName)
          else
            branch=$(gh pr list --state open --json headRefName,body \
              --jq "[.[] | select(.body | test(\"(?i)closes #$NUMERO([^0-9]|\$)\"))][0].headRefName // empty")
          fi
          if [ -n "$branch" ]; then
            echo "Build su $branch"
            gh workflow run build.yml --ref "$branch"
          else
            echo "Nessuna PR aperta per #$NUMERO"
          fi

      - name: Aggiorna le etichette
        if: always()
        run: |
          gh issue edit "$NUMERO" --remove-label claude:in-corso >/dev/null 2>&1 || true
          # "Fatto" solo se c'è una PR (aperta dalla sessione o dal salvataggio qui sopra).
          if gh pr view "$NUMERO" --json number >/dev/null 2>&1; then
            pr=$NUMERO
          else
            pr=$(gh pr list --state open --json number,body \
              --jq "[.[] | select(.body | test(\"(?i)closes #$NUMERO([^0-9]|\$)\"))][0].number // empty")
          fi
          if gh issue view "$NUMERO" --json labels --jq '.labels[].name' | grep -qx needs-info; then
            # L'esecutore si è fermato per chiedere informazioni: il ticket non è fatto.
            true
          elif [ "${{ job.status }}" = "success" ] && [ -n "$pr" ]; then
            gh issue edit "$NUMERO" --add-label claude:fatto
          elif [ "${{ job.status }}" = "success" ]; then
            gh issue edit "$NUMERO" --add-label claude:errore
            gh issue comment "$NUMERO" --body "⚠️ La sessione è finita senza PR e senza lavoro da salvare: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (la trascrizione è tra gli artifact).
          Per riprovare scrivi un commento con @claude."
          else
            gh issue edit "$NUMERO" --add-label claude:errore
            gh issue comment "$NUMERO" --body "⚠️ L'esecuzione non è andata a buon fine: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Per riprovare scrivi un commento con @claude."
          fi
